<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Age Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="AGE.css">
</head>
<body>

    <div class="app">

        <!-- Header / Profile -->
        <header class="profile">
            <img src="save_as_copy.jpg" alt="Profile Photo">
            <h2>Yadav_Ji</h2>
            <p>Frontend Web Development Project</p>
        </header>

        <!-- Card -->
        <main class="card">
            <h1>Advanced Age Calculator</h1>
            <p class="description">
                Calculate your exact age in years, months, and days using real-time date logic.
            </p>

            <label>Date of Birth</label>
            <input type="date" id="dob">

            <button onclick="calculateAge()">Calculate Age</button>

            <div id="result" class="result"></div>
        </main>

        <!-- Footer -->
        <footer>
            <p>© 2026 | Developed by Abhishek Yadav</p>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="AGE.js"></script>
</body>
</html>
